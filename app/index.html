<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budgeter</title>
<style>
/* Fonts ship with the app (app/fonts, SIL Open Font License), so opening it makes no network requests */
@font-face{font-family:"Hanken Grotesk";font-weight:400 600;font-display:swap;src:url(fonts/hanken-grotesk-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Hanken Grotesk";font-weight:400 600;font-display:swap;src:url(fonts/hanken-grotesk-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Schibsted Grotesk";font-weight:600 800;font-display:swap;src:url(fonts/schibsted-grotesk-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Schibsted Grotesk";font-weight:600 800;font-display:swap;src:url(fonts/schibsted-grotesk-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: one working column, sticky month bar + tabs, ledger tables below a headline equation */
:root{
  --bg:#f2f4f1;--surface:#ffffff;--ink:#16201c;--muted:#5a6863;--line:#d8ded9;
  --accent:#1f5e4f;--on-accent:#ffffff;--soft:#e0ebe6;
  --pos:#17744a;--neg:#b3392a;--warn:#8a5a06;--posbg:#dcf1e5;--negbg:#f7e1dc;--warnbg:#fbecc9;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s0:#9aa39f;
  --head:"Schibsted Grotesk","Hanken Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513;--surface:#16201d;--ink:#e6eeea;--muted:#95a59e;--line:#26332f;
  --accent:#6fcfae;--on-accent:#0f1513;--soft:#1c3029;
  --pos:#5cd39f;--neg:#ff8b78;--warn:#e8b04d;--posbg:#123428;--negbg:#3b1e19;--warnbg:#3a2c0d;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s0:#6b7571;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513;--surface:#16201d;--ink:#e6eeea;--muted:#95a59e;--line:#26332f;
  --accent:#6fcfae;--on-accent:#0f1513;--soft:#1c3029;
  --pos:#5cd39f;--neg:#ff8b78;--warn:#e8b04d;--posbg:#123428;--negbg:#3b1e19;--warnbg:#3a2c0d;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s0:#6b7571;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:18px 10px}
h1{font:800 25px/1.1 var(--head);margin:0;letter-spacing:-.02em}
h2{font:700 18px/1.2 var(--head);margin:0 0 10px;text-wrap:balance}
h3{font:700 18px/1.2 var(--head);margin:0 0 14px}
.mn{display:flex;align-items:center;gap:6px}
#mlabel{font:700 17px var(--head);min-width:130px;text-align:center}
.st{font-size:12.5px;color:var(--muted);min-width:80px;text-align:right}
.st.bad{color:var(--neg)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
.tab{padding:10px 13px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.btn{font:600 14px var(--body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--neg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{background:none;border:0;padding:0;color:var(--accent);font:600 inherit var(--body);font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.mini{width:108px;text-align:right;padding:4px 8px}
.mid{width:150px}
.sec{margin:28px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.eq{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;padding:20px 0 6px}
.eq .t{display:flex;flex-direction:column;min-width:0}
.eq small{color:var(--muted);font-size:13px}
.eq b{font:700 29px/1.1 var(--head);letter-spacing:-.01em}
.eq .op{font:500 24px/1 var(--head);color:var(--muted);padding-bottom:4px}
.eq .free b{font-size:37px}
.left{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:14px 0 0}
.left b{font:700 22px var(--head)}
.note{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13.5px;color:var(--muted);margin:8px 0 0}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.alert{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;margin:14px 0 0;font-size:14px}
.alert.late{background:var(--negbg);color:var(--neg)}
.alert .muted{color:inherit;opacity:.85}
.tip{display:flex;gap:6px 12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:8px}
.tip>span{flex:1;min-width:220px}
.kick{background:var(--soft);border-radius:12px;padding:16px 18px;margin:18px 0 0;display:flex;gap:10px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kick p{margin:4px 0 0;max-width:64ch}
.need{border-color:var(--neg)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
tr.done td{opacity:.5}
tr.past td{color:var(--muted)}
tr.tot td{font-weight:600;background:var(--bg)}
tr.grp td{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding-block:6px}
tr.short td:first-child{box-shadow:inset 3px 0 0 var(--neg)}
.grip{display:inline-flex;align-items:center;justify-content:center;width:28px;height:32px;margin:-8px 4px -8px -8px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);cursor:grab;touch-action:none;vertical-align:middle}
.grip:hover{color:var(--ink);background:var(--soft)}
.grip-sp{display:inline-block;width:24px}
td.catn{white-space:nowrap}
tr.drag td{background:var(--soft)}
tr.drag .grip{cursor:grabbing;color:var(--accent)}
body.dragging,body.dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--accent);margin-left:6px;white-space:nowrap}
.pill.tag{background:var(--warnbg);color:var(--warn)}
.btn.tcat{font-weight:500;white-space:nowrap}
.btn.tcat::after{content:"▾";margin-left:6px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--neg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal>div{background:var(--surface);min-height:84px;padding:4px 5px;min-width:0}
.cal>.dow{min-height:0;text-align:center;color:var(--muted);font-size:12px;padding:5px 0}
.cal>.blank{background:var(--bg)}
.cal .day{font-size:12px;color:var(--muted)}
.cal .today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .today .day{color:var(--accent);font-weight:700}
.cal .kday{box-shadow:inset 0 0 0 2px var(--warn)}
.chip{display:block;font-size:11px;line-height:1.35;margin-top:2px;padding:1px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.in{background:var(--posbg);color:var(--pos)}
.chip.out{background:var(--negbg);color:var(--neg)}
.chip.save{background:var(--soft);color:var(--accent)}
.chip.due{background:none;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.chip.note{background:var(--warnbg);color:var(--warn);font-weight:600}
.chip.done{opacity:.45;text-decoration:line-through}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.row .grow{flex:1;min-width:160px}
.qa{display:grid;grid-template-columns:130px 110px minmax(140px,1.4fr) minmax(120px,1fr) minmax(120px,1fr) minmax(90px,.8fr) auto;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.qa label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.qa .btn{height:40px}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 8px}
.goal .nm{font-weight:600}
.goal .meta{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.goal .bar{grid-column:1/-1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card small{color:var(--muted);font-size:13px}
.card b{font:700 22px var(--head)}
.viz{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 8px;position:relative}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz text{font:12px var(--body);fill:var(--muted)}
.viz .gl{stroke:var(--line);stroke-width:1}
.viz .base{stroke:var(--muted);stroke-width:1}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin:0 0 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chatlog{display:grid;gap:8px;margin:12px 0 0}
.msg{padding:10px 12px;border-radius:10px;max-width:72ch;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--soft)}
.msg.ai{justify-self:start;background:var(--surface);border:1px solid var(--line)}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0 6px;padding-left:20px}
.msg .muted{font-size:13px}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:3;transform:translate(-50%,-110%)}
.foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto}
dialog::backdrop{background:rgba(10,15,20,.55)}
.fld{display:grid;gap:4px;margin:0 0 12px}
.fld label{font-size:13px;color:var(--muted)}
.fld small{color:var(--muted);font-size:12.5px}
.fld.two{grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--neg);font-size:13.5px;min-height:1em;margin:0 0 8px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.acts.left{justify-content:flex-start;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.toast .lnk{color:inherit;margin-left:12px}
.since{font-size:12.5px;color:var(--muted);line-height:1.5}
@media (max-width:760px){.qa{grid-template-columns:1fr 1fr}.qa .wide{grid-column:1/-1}.qa .btn{grid-column:1/-1}}
@media (max-width:640px){
  .cal>div{min-height:52px}
  .chip{font-size:0;height:7px;width:7px;padding:0;display:inline-block;border-radius:50%;margin:3px 2px 0 0}
  .chip.in{background:var(--pos)}.chip.out{background:var(--neg)}.chip.due{background:var(--muted);box-shadow:none}.chip.note{background:var(--warn)}.chip.save{background:var(--accent)}
  .eq b{font-size:23px}.eq .free b{font-size:29px}
  th,td{padding:8px}
}
@media (max-width:640px){.kt thead{display:none}.kt,.kt tbody{display:block}.kt tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px;border-bottom:1px solid var(--line)}.kt tr.grp{display:block;padding:6px 12px}.kt td{border:0;padding:0;text-align:left!important}.kt td:first-child{grid-column:1/-1}.kt td:empty{display:none}.kt td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted)}.kt .mini,.kt .mid{width:100%;text-align:left}}
@media (prefers-reduced-motion:no-preference){.toast{animation:fade .2s}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Budgeter</h1>
    <div class="mn" id="mnav">
      <button class="btn sm" data-act="prev" aria-label="Previous month" data-ta="Previous month">&lsaquo;</button>
      <span id="mlabel"></span>
      <button class="btn sm" data-act="next" aria-label="Next month" data-ta="Next month">&rsaquo;</button>
      <button class="btn sm ghost" data-act="today" data-t="Today">Today</button>
    </div>
    <span id="st" class="st"></span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="overview" data-t="Overview">Overview</button>
    <button class="tab" role="tab" data-tab="spend" data-t="Spending">Spending</button>
    <button class="tab" role="tab" data-tab="bills" data-t="Bills">Bills</button>
    <button class="tab" role="tab" data-tab="income" data-t="Income">Income</button>
    <button class="tab" role="tab" data-tab="accounts" data-t="Accounts">Accounts</button>
    <button class="tab" role="tab" data-tab="debt" data-t="Debt">Debt</button>
    <button class="tab" role="tab" data-tab="trends" data-t="Trends">Trends</button>
    <button class="tab" role="tab" data-tab="goals" data-t="Goals">Goals</button>
  </div>
  <main id="main"><div class="empty" style="margin-top:24px">Loading your budget…</div></main>
  <div class="foot"><button class="btn sm" data-act="settings" data-t="Language and currency">Language and currency</button><button class="btn sm" data-act="kickoff" data-t="Redo kickoff">Redo kickoff</button><button class="btn sm" data-act="backup" data-t="Download backup">Download backup</button><button class="btn sm" data-act="restore" data-t="Restore from backup">Restore from backup</button><input type="file" id="rf" accept=".json,application/json" hidden><span class="muted" id="savenote" data-t="Changes save automatically to this device.">Changes save automatically to this device.</span></div>
</div>
<dialog id="dlg"></dialog>

/* Russian has three plural forms: 1 платёж, 2 платежа, 5 платежей. The dictionary key is "one|other" in English. */

const lget=k=>{try{const v=localStorage.getItem('budgeter:'+k);return v?JSON.parse(v):null}catch(e){return null}};

function status(t,c){const e=$('#st');e.textContent=t;e.className='st '+(c||'')}

async function sRead(k){
  const l=lget(k);let c=null;

function flushKey(k){

/* Saved data is checked before use. A backup file can come from anywhere, so ids, dates and amounts are forced into

const ISO_D=/^\d{4}-\d{2}-\d{2}$/,ISO_M=/^\d{4}-\d{2}$/,ID_OK=/^[\w.-]{1,64}$/;

const NUM_K='amt day2 dom issue bal cash divAmt contrib match cday2 ret ytd apy intday limit dueDay stmt typ apr min lead target saved updAt'.split(' ');
const DATE_K='date end upd duedate divDate cdate ytdOn'.split(' ');

function cleanItem(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return null;
  const x={...o};
  if(!okId(x.id))x.id=uid();
  NUM_K.forEach(k=>{if(k in x&&typeof x[k]!=='number')x[k]=fnum(x[k])});
  DATE_K.forEach(k=>{if(k in x)x[k]=okDate(x[k])});
  REF_K.forEach(k=>{if(k in x&&!okId(x[k]))x[k]=''});
  TEXT_K.forEach(k=>{if(k in x&&typeof x[k]!=='string')x[k]=String(x[k]??'')});
  ['freq','cfreq','divFreq'].forEach(k=>{if(k in x&&!FREQ_K.has(x[k]))x[k]=k==='freq'?'monthly':k==='cfreq'?'biweekly':'quarterly'});
  if('type' in x&&!TYPE_K.has(x.type))x.type='checking';

/* plan.merch and other maps become prototype-free dicts with checked values */
function cleanMap(o,fn){const d=dict();if(o&&typeof o==='object')for(const k of Object.keys(o)){const v=fn(o[k],k);if(v!==undefined)d[k]=v}return d}

/* one month of logged transactions */
function cleanTx(v,m){

  return{items:items.filter(t=>t&&typeof t==='object').map(t=>({...t,
    id:okId(t.id)?t.id:uid(),date:okDate(t.date)||m+'-01',desc:String(t.desc??''),amt:fnum(t.amt),
    cat:typeof t.cat==='string'&&t.cat?t.cat:'Uncategorized',acct:okId(t.acct)?t.acct:'',tag:typeof t.tag==='string'?t.tag:'',

  const data=JSON.stringify({app:'budgeter',version:2,exported:new Date().toISOString(),plan,tx:t},null,1);
  try{await saveFile(`budgeter-backup-${TODAY}.json`,data,'application/json');toast(T('Backup ready: plan and {months} of spending',{months:`${months.length} ${TN(months.length,'month','months')}`}))}catch(e){toast(T('Backup was not saved'))}
}
function restore(file){
  const r=new FileReader();
  r.onload=()=>{
    let b;try{b=JSON.parse(String(r.result))}catch(e){toast(T('That file is not a valid backup'));return}
    const ok=b&&(b.app==='budgeter'||b.app==='monthly-planner')&&b.plan&&['income','bills','accounts'].every(k=>Array.isArray(b.plan[k]));
    if(!ok){toast(T('That file is not a Budgeter or Monthly planner backup'));return}
    if(S.locked){toast(T('Your data didn’t load. Reload the page, then restore.'));return}
    const bt=b.tx&&typeof b.tx==='object'?b.tx:{};
    const ms=Object.keys(bt).filter(m=>ISO_M.test(m)&&bt[m]&&Array.isArray(bt[m].items));
    const when=typeof b.exported==='string'&&ISO_D.test(b.exported.slice(0,10))?` (${b.exported.slice(0,10)})`:'';
    ask(T('Restore your plan and {months} of spending from this backup{when}?',{months:`${ms.length} ${TN(ms.length,'month','months')}`,when}),T('Restore'),()=>{
      plan=Object.assign(blank(),b.plan);upgrade(plan);savePlan();
      ms.forEach(m=>{tx[m]=cleanTx(bt[m],m);saveTx(m)});
      render();toast(T('Backup restored'));
    });
  };
  r.readAsText(file);
}
/* Loads a month once. Callers at the same time share one read, so a transaction logged while the month is
   still loading can't be overwritten by the copy that finishes loading after it. */
const loadingTx={};
function ensureTx(m){
  if(tx[m])return Promise.resolve();
  return loadingTx[m]||(loadingTx[m]=sRead('tx-'+m).then(
    v=>{if(!tx[m])tx[m]=cleanTx(v,m)},
    ()=>{S.locked=true;if(!tx[m])tx[m]={items:[]};status(T('Load failed: reload before editing'),'bad')}
  ).finally(()=>{delete loadingTx[m]}));
}

/* ---------- schedules ---------- */
function occ(it,y,m){
  if(!it.date)return[];
  const [ay,am,ad0]=it.date.split('-').map(Number),ad=+it.dom||ad0;
  const dim=new Date(y,m+1,0).getDate(),i=y*12+m,ai=ay*12+am-1,f=it.freq,o=[];
  const k=d=>`${y}-${pad(m+1)}-${pad(d)}`,c=d=>Math.min(Math.max(1,d),dim);
  if(f==='weekly'||f==='biweekly'){
    const st=f==='weekly'?7:14,a=Date.UTC(ay,am-1,ad);
    for(let d=1;d<=dim;d++){const diff=(Date.UTC(y,m,d)-a)/864e5;if(diff>=0&&diff%st===0)o.push(k(d))}
  }else if(i>=ai){
    if(f==='once'){if(i===ai)o.push(k(ad))}
    else if(f==='monthly')o.push(k(c(ad)));
    else if(f==='semi'){o.push(k(c(ad)));o.push(k(c(+it.day2||15)))}
    else if(f==='quarterly'){if((i-ai)%3===0)o.push(k(c(ad)))}
    else if(f==='semiannual'){if((i-ai)%6===0)o.push(k(c(ad)))}
    else if(f==='yearly'){if((i-ai)%12===0)o.push(k(c(ad)))}
  }
  return [...new Set(o)].sort().filter(d=>d>=it.date&&(!it.end||d<=it.end));
}
function sched(i){
  const [y,m,d]=(i.date||'').split('-').map(Number);if(!d)return'';
  const md=dl(i.date),d2=+i.day2||15,v={date:md,y,d:ord(d),n:d,d2:ord(d2),n2:d2};
  const s={monthly:'Monthly on the {d}',semi:'Twice a month, the {d} and {d2}',biweekly:'Every 2 weeks from {date}',weekly:'Weekly from {date}',quarterly:'Every 3 months from {date}',semiannual:'Every 6 months from {date}',yearly:'Yearly on {date}',once:'Once on {date}, {y}'}[i.freq];
  return(i.date>TODAY&&i.freq!=='once'?T('Starts {date}, {y}. ',v):'')+(s?T(s,v):'')+(i.end?T(', until {month} {y}',{month:mon(+i.end.slice(5,7)-1),y:i.end.slice(0,4)}):'');
}
const PER={weekly:52,biweekly:26,semi:24,monthly:12,quarterly:4,semiannual:2,yearly:1,once:1};
const cardPay=a=>a.type==='credit'&&!!a.payfrom;

  return'';
}

function cardEst(a,y,m){

}
function build(y,m){

  plan.income.forEach(n=>occ(n,y,m).forEach(d=>o.push(mkEv('in',n,d))));
  plan.bills.forEach(b=>{if(b.planned&&!plan.showPlanned)return;occ(b,y,m).forEach(d=>o.push(mkEv('out',b,d,{planned:!!b.planned,bill:true})))});

    plan.accounts.forEach(a=>{

      if(!a.duedate||!+a.dueDay)return;

      if(i===ai&&+a.stmt>0)o.push(mkEv('out',{...base,amt:a.stmt},a.duedate,{card:a.id}));
      else if(i>ai){const amt=+a.typ>0?+a.typ:cardEst(a,y,m);if(amt>0)occ({freq:'monthly',date:a.duedate,dom:+a.dueDay},y,m).forEach(d=>o.push(mkEv('out',{...base,amt,variable:true},d,{card:a.id,guess:!(+a.typ>0)})))}
    });
    plan.accounts.forEach(a=>{if(hasInt(a))occ({freq:'monthly',date:'2000-01-'+pad(Math.min(31,+a.intday||31))},y,m).forEach(d=>o.push(mkEv('in',{id:'int-'+a.id,name:T('{name} interest',{name:a.name}),amt:mInt(a),acct:a.id,variable:true},d,{interest:true,passive:true})))});
    plan.accounts.forEach(a=>{if(a.type==='investment'&&+a.divAmt>0&&a.divDate)occ({freq:a.divFreq||'quarterly',date:a.divDate},y,m).forEach(d=>o.push(mkEv('in',{id:'div-'+a.id,name:T('{name} dividend',{name:a.name}),amt:a.divAmt,acct:a.id,variable:true},d,{dividend:true,passive:true,mode:a.divMode==='reinvest'?'reinvest':'cash'})))});
    plan.accounts.forEach(a=>{
      if(!['retirement','hsa'].includes(a.type)||!a.cdate||!(+a.contrib>0||+a.match>0))return;
      const hsa=isHSA(a);
      occ({freq:a.cfreq||'biweekly',date:a.cdate,day2:a.cday2},y,m).forEach(d=>{
        if(+a.contrib>0)o.push(a.cfrom?mkEv('out',{id:'k-'+a.id,name:T('{name} contribution',{name:a.name}),amt:a.contrib,acct:a.cfrom,cat:'Savings'},d,{to:a.id,contrib:true,hsa}):mkEv('save',{id:'k-'+a.id,name:T('{name} contribution',{name:a.name}),amt:a.contrib,acct:a.id},d,{contrib:true,hsa}));
        if(+a.match>0)o.push(mkEv('save',{id:'m-'+a.id,name:T(hsa?'{name} employer contribution':'{name} employer match',{name:a.name}),amt:a.match,acct:a.id},d,{contrib:true,hsa}));
      });

  }
  o.forEach(e=>{const a=payAcct(e);if(!a)return;e.pay=true;e.due=e.date;e.payAcct=a.id;const ov=plan.payOn?.[e.key];e.date=ov||defPay(e,a);e.moved=!!ov});
  return o;
}

function evs(y,m,raw){
  const k=KICK(),mk2=`${y}-${pad(m+1)}`,o=[];
  for(let j=-1;j<=1;j++){const i=y*12+m+j;build(Math.floor(i/12),((i%12)+12)%12).forEach(e=>{if(e.date.slice(0,7)===mk2&&(j===0||e.pay))o.push(e)})}

}

const hol={};
function holidays(y,cal=holCal()){
  const hk=cal+y;if(hol[hk])return hol[hk];const set=new Set();
  const day=(m,d)=>set.add(isoOf(new Date(y,m,d)));
  if(cal==='se'){
    /* Easter Sunday (Gregorian computus); Swedish holidays falling on a weekend aren't moved */
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),em=Math.floor((h+l-7*m+114)/31)-1,ed=(h+l-7*m+114)%31+1;
    const easter=n=>day(em,ed+n);
    day(0,1);day(0,6);easter(-2);easter(1);day(4,1);easter(39);day(5,6);day(11,24);day(11,25);day(11,26);day(11,31);
    /* Midsummer Eve: the Friday between June 19 and 25. Banks also close on Christmas Eve and New Year's Eve. */
    for(let dd=19;dd<=25;dd++)if(new Date(y,5,dd).getDay()===5)day(5,dd);
    return hol[hk]=set;
  }
  const nth=(m,dow,n)=>1+((dow-new Date(y,m,1).getDay()+7)%7)+(n-1)*7;
  const lastDow=(m,dow)=>{const l=new Date(y,m+1,0);return l.getDate()-((l.getDay()-dow+7)%7)};
  const fixed=(m,d)=>{const dt=new Date(y,m,d),w=dt.getDay();if(w===6)return;if(w===0)dt.setDate(d+1);set.add(isoOf(dt))};
  fixed(0,1);day(0,nth(0,1,3));day(1,nth(1,1,3));day(4,lastDow(4,1));fixed(5,19);fixed(6,4);day(8,nth(8,1,1));day(9,nth(9,1,2));fixed(10,11);day(10,nth(10,4,4));fixed(11,25);
  return hol[hk]=set;
}
const isBiz=dt=>dt.getDay()>0&&dt.getDay()<6&&!holidays(dt.getFullYear()).has(isoOf(dt));
function bizBefore(iso,n){const [y,m,d]=iso.split('-').map(Number),dt=new Date(y,m-1,d);while(n>0){dt.setDate(dt.getDate()-1);if(isBiz(dt))n--}return isoOf(dt)}
const wdl=iso=>dfmt({weekday:'short',month:LANG==='ru'?'long':'short',day:'numeric'}).format(new Date(iso+'T12:00:00'));
/* how an event moves one account's balance */
function applyEv(bal,hold,e){
  const a=acct(e.acct);
  if(a&&e.dividend&&e.mode==='reinvest')hold[a.id]+=e.amt;
  else if(a){bal[a.id]+=(e.t==='out'?-1:1)*e.amt*(isDebt(a)?-1:1);e.after=bal[a.id];e.debt=isDebt(a)}
  if(e.card&&bal[e.card]!=null)bal[e.card]-=e.amt;
  const t=acct(e.to);
  if(t&&bal[t.id]!=null){if(isDebt(t)){const int=bal[t.id]*(+t.apr||0)/1200;bal[t.id]=Math.max(0,bal[t.id]-(e.amt-int))}else bal[t.id]+=e.amt}
}
function projectNow(){
  const vi=view.y*12+view.m,s0=START(),ti=mi(s0),cur=evs(view.y,view.m);
  if(vi<ti)return{list:cur,end:null,tips:[]};
  const bal={},hold={},inj={},tips=[];let end=null,endH=null;
  plan.accounts.forEach(a=>{const inv=a.type==='investment';bal[a.id]=inv?(+a.cash||0):isHSA(a)?hsaNow(a):(+a.bal||0);if(inv)hold[a.id]=+a.bal||0});
  for(let i=ti;i<=vi+1;i++){
    const list=i===vi?cur:evs(Math.floor(i/12),i%12);
    list.forEach(e=>{
      if(e.date<s0||plan.done[e.key])return;
      const a=acct(e.acct);
      if(e.interest&&!e.hasActual&&a)e.amt=e.est=r2(bal[a.id]*rate(a));
      applyEv(bal,hold,e);
      if(a&&!isDebt(a)&&e.t==='out'){
        const b=bal[a.id]+(inj[a.id]||0);
        if(b<0){const need=Math.ceil(-b-1e-9),d0=bizBefore(e.date,3);inj[a.id]=(inj[a.id]||0)+need;e.short=need;
          tips.push({acct:a.id,amount:need,date:e.date,name:e.name,key:e.key,late:d0<TODAY,deadline:d0<TODAY?TODAY:d0})}
      }
    });
    {const dim=new Date(Math.floor(i/12),i%12+1,0).getDate(),fr=i===ti?Math.max(0,(dim-(+s0.slice(8,10)))/dim):1;
      plan.accounts.forEach(a=>{if((a.type==='retirement'||isHSA(a))&&+a.ret>0)bal[a.id]*=Math.pow(1+a.ret/100,fr/12)})}
    if(i===vi){end={...bal};endH={...hold}}
  }

  return{list:cur,end,endH,tips:tips.filter(t=>t.date.slice(0,7)===m||t.deadline.slice(0,7)===m)};
}
/* balance change for one account from scheduled items after its last update and before kickoff */
function sinceKick(a){
  const k=KICK(),from=a.upd||'';if(!k||!from||from>=k)return{items:[],d:0,dc:0};
  const items=[];let d=0,dc=0;
  for(let i=mi(from);i<=mi(k);i++)evs(Math.floor(i/12),i%12,true).forEach(e=>{
    if(e.date<=from||e.date>=k||plan.done[e.key])return;
    let x=0,c=0;
    if(e.acct===a.id){if(e.dividend){if(e.mode==='reinvest')x=e.amt;else c=e.amt}else x=(e.t==='out'?-1:1)*e.amt*(isDebt(a)?-1:1)}
    if(e.card===a.id)x-=e.amt;
    if(e.to===a.id)x+=isDebt(a)?-(e.amt-(+a.bal||0)*(+a.apr||0)/1200):e.amt;
    if(x||c){items.push({e,x:x||c});d+=x;dc+=c}
  });
  return{items,d:r2(d),dc:r2(dc)};
}

const ISSUE_DAYS=21;

function billOccs(b,from,to){const o=[];for(let i=mi(from);i<=mi(to);i++)occ(b,Math.floor(i/12),i%12).forEach(d=>{if(d>=from&&d<=to)o.push(d)});return o}

/* bills that should be out by now (or went unpaid in the last two weeks) with no amount entered */
function billsToEnter(){

  plan.bills.forEach(b=>{
    if(!b.variable||(b.planned&&!plan.showPlanned))return;
    billOccs(b,addDays(TODAY,-14),addDays(TODAY,62)).forEach(d=>{
      const key=billKey(b,d);

function goalNeed(g){

  return rem/Math.max(1,mi(g.date)-(now.getFullYear()*12+now.getMonth()));

function payoff(a){
  const B=+a.bal||0,P=+a.min||0,r=(+a.apr||0)/1200;
  if(B<=0)return T('Paid off');if(P<=0)return T('Add a payment');
  let n;if(r===0)n=B/P;else{if(P<=B*r)return T('Payment ≤ interest');n=-Math.log(1-r*B/P)/Math.log(1+r)}

/* check(o), if given, returns an error to show instead of saving */
function openForm(title,fields,vals,onSave,check){
  const d=$('#dlg');
  d.innerHTML=`<h3>${esc(T(title))}</h3>`+fields.map(f=>{
    const val=vals[f.k]??'';let inp;
    if(f.t==='select')inp=`<select id="f-${f.k}" name="${f.k}">${f.opts.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if(f.t==='checkbox')inp=`<label class="chk"><input id="f-${f.k}" type="checkbox" name="${f.k}"${val?' checked':''}> ${esc(T(f.l))}</label>`;
    else if(f.t==='textarea')inp=`<textarea id="f-${f.k}" name="${f.k}" rows="8" placeholder="${esc(T(f.ph||''))}">${esc(val)}</textarea>`;
    else inp=`<input id="f-${f.k}" name="${f.k}" type="${f.t||'text'}"${f.t==='number'?' step="any" inputmode="decimal"':''}${f.list?` list="dl-${f.k}"`:''} value="${esc(val)}" placeholder="${esc(T(f.ph||''))}">${f.list?`<datalist id="dl-${f.k}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;
    return`<div class="fld" data-k="${f.k}">${f.t==='checkbox'?'':`<label for="f-${f.k}">${esc(T(f.l))}</label>`}${inp}${f.help?`<small>${esc(T(f.help))}</small>`:''}</div>`;
  }).join('')+`<p class="err" id="ferr"></p><div class="acts"><button class="btn" type="button" data-close>${T('Cancel')}</button><button class="btn pri" type="button" id="fs">${T('Save')}</button></div>`;
  const get=()=>{const o={};fields.forEach(f=>{const el=d.querySelector(`[name="${f.k}"]`);o[f.k]=f.t==='checkbox'?el.checked:f.t==='number'?(el.value===''?NaN:parseFloat(el.value)):el.value.trim()});return o};
  const sync=()=>{const o=get();fields.forEach(f=>{if(f.show)d.querySelector(`[data-k="${f.k}"]`).hidden=!f.show(o)})};
  d.oninput=d.onchange=sync;sync();
  d.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='file'){e.preventDefault();$('#fs').click()}};
  d.querySelector('[data-close]').onclick=()=>d.close();
  $('#fs').onclick=()=>{
    const o=get();
    for(const f of fields){
      if(f.show&&!f.show(o)){o[f.k]=f.t==='number'?0:f.t==='checkbox'?false:'';continue}
      if((typeof f.req==='function'?f.req(o):f.req)&&(f.t==='number'?isNaN(o[f.k]):!o[f.k])){$('#ferr').textContent=T('{field} is required.',{field:T(f.l)});return}
      if(f.t==='number'&&isNaN(o[f.k]))o[f.k]=0;
    }
    const bad=check?.(o);if(bad){$('#ferr').textContent=bad;return}
    d.close();onSave(o);
  };
  d.showModal();
}

/* ---------- transfers between accounts ----------
   Money leaves a cash account, an investment's buying power or an HSA, and goes into one of those,
   a retirement account, or pays down a card or loan. Balances are what's there now, so a transfer
   changes both at once; each account's "as of" date stays, since nothing was re-read from the bank. */
const XFROM=['checking','savings','cash','investment','hsa'],XTO=[...XFROM,'retirement','credit','loan'];

/* moves amt between two accounts by id; returns a function that undoes it, or null */
function moveMoney(fromId,toId,amt){
  const from=acct(fromId),to=acct(toId);amt=r2(+amt);
  if(!from||!to||from===to||!(amt>0)||!XFROM.includes(from.type)||!XTO.includes(to.type))return null;
  const was=[];
  const set=(a,k,v)=>{was.push([a.id,k,a[k]]);a[k]=r2(v)};
  set(from,xField(from),(+from[xField(from)]||0)-amt);
  if(isDebt(to)){
    set(to,'bal',Math.max(0,(+to.bal||0)-amt));
    /* paying a card early also pays its statement, so the scheduled payment shrinks */
    if(to.type==='credit'&&+to.stmt>0)set(to,'stmt',Math.max(0,+to.stmt-amt));
  }else set(to,xField(to),(+to[xField(to)]||0)+amt);
  return()=>was.reverse().forEach(([id,k,v])=>{const a=acct(id);if(!a)return;if(v===undefined)delete a[k];else a[k]=v});
}
function transfer(pre={}){

  const to=acct(pre.to)&&XTO.includes(acct(pre.to).type)?pre.to:'';
  const from=acct(pre.from)&&XFROM.includes(acct(pre.from).type)?pre.from:(src.find(a=>a.id!==to)||src[0]).id;
  openForm('Transfer between accounts',[
    {k:'from',l:'From',t:'select',opts:src.map(a=>[a.id,`${a.name} · ${f0(xAvail(a))}`])},
    {k:'to',l:'To',t:'select',opts:dst.map(a=>[a.id,isDebt(a)?`${a.name} · ${T('owed {amt}',{amt:f0(+a.bal||0)})}`:`${a.name} · ${f0(xAvail(a))}`])},

/* ---------- import ---------- */
/* Amounts as banks print them: 1,234.56 · 1 234,56 · 1.234,56 · 1'234.56 · (12.50) · 12.50- · −12,50 · $-12.
   With both separators, the last one is the decimal point. A lone comma is a thousands separator only in 1,234 form. */
function pn(s){
  s=String(s??'').trim();if(!s||!/\d/.test(s))return NaN;
  const neg=/^\(.*\)$/.test(s)||/^[^\d]*[-−–]/.test(s)||/[-−–]\s*$/.test(s);
  let n=s.replace(/[^\d.,]/g,'');
  const lc=n.lastIndexOf(','),ld=n.lastIndexOf('.');
  if(lc>=0&&ld>=0)n=lc>ld?n.replace(/\./g,'').replace(',','.'):n.replace(/,/g,'');
  else if(lc>=0)n=/^[1-9]\d{0,2}(,\d{3})+$/.test(n)||n.split(',').length>2?n.replace(/,/g,''):n.replace(',','.');
  else if(n.split('.').length>2)n=n.replace(/\./g,'');
  const v=parseFloat(n);return isNaN(v)?NaN:neg?-v:v;
}
/* Dates: 2026-03-25, 03/25/2026 or 25.03.2026. order says which comes first in 03/04/2026 ('mdy' or 'dmy');
   without it, dots mean day first (European) and slashes month first (US). A part over 12 settles it either way. */
function pd(s,order){
  s=String(s||'').trim();let m,y,mo,d;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)){y=+m[1];mo=+m[2];d=+m[3]}
  else if(m=s.match(/^(\d{1,2})([\/\-.])(\d{1,2})[\/\-.](\d{2,4})(?!\d)/)){
    y=+m[4];if(y<100)y+=2000;const a=+m[1],b=+m[3];
    const dayFirst=a>12?true:b>12?false:(order||(m[2]==='.'?'dmy':'mdy'))==='dmy';
    [mo,d]=dayFirst?[b,a]:[a,b];
  }
  else if(/[a-z]{3}/i.test(s)){const dt=new Date(s);if(isNaN(dt))return null;y=dt.getFullYear();mo=dt.getMonth()+1;d=dt.getDate()}
  else return null;
  if(y<2000||mo<1||mo>12||d<1||d>new Date(y,mo,0).getDate())return null;
  return`${y}-${pad(mo)}-${pad(d)}`;
}
/* which order a column of dates uses: any first part over 12 means day first, any second part over 12 month first */
function dateOrder(vals){
  let n=0,dots=0;
  for(const v of vals){
    const m=String(v??'').trim().match(/^(\d{1,2})([\/\-.])(\d{1,2})[\/\-.]\d{2,4}/);if(!m)continue;
    n++;if(+m[1]>12)return'dmy';if(+m[3]>12)return'mdy';if(m[2]==='.')dots++;
  }
  return n&&dots>n/2?'dmy':'mdy';
}
/* the same purchase in the same amount on the same day */
const txKey=t=>`${t.date}|${String(t.desc).toLowerCase()}|${(+t.amt).toFixed(2)}`;
/* Rows not logged yet. Each logged transaction covers one matching row, so two identical coffees on one
   statement both import. within: also drop repeats inside rows (overlapping screenshot pieces). */
function freshRows(rows,logged,within){
  const have=dict();logged.forEach(t=>{const k=txKey(t);have[k]=(have[k]||0)+1});
  const seen=new Set();
  return rows.filter(r=>{
    const k=txKey(r);
    if(have[k]>0){have[k]--;return false}
    if(within){if(seen.has(k))return false;seen.add(k)}
    return true;
  });
}
/* The AI copies each amount as printed and says which way the money went; this sets the sign.
   When printed amounts mix plus and minus, the statement's own convention decides, as with CSVs: mostly plain
   amounts is a card statement (plain = money out), mostly minus is a bank statement (minus = money out).
   With no signs at all, the AI's out/in label decides. */
function aiRows(res){
  const arr=Array.isArray(res)?res:(res&&res.transactions)||[];
  const nums=arr.map(r=>typeof r.amount==='number'?r.amount:pn(r.amount)).filter(n=>n&&!isNaN(n)),neg=nums.filter(n=>n<0).length,pos=nums.length-neg,mixed=neg>0&&pos>0;
  return arr.map(r=>{const a=typeof r.amount==='number'?r.amount:pn(r.amount);return{date:pd(r.date),desc:String(r.description||'').trim(),amt:mixed?(pos>=neg?-a:a):r.money==='in'?Math.abs(a):r.money==='out'?-Math.abs(a):a}})
    .filter(r=>r.date&&r.desc&&!isNaN(r.amt)&&r.amt!==0&&!/\bpending\b/i.test(r.desc));
}
function parseCSV(t){
  t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/,1)[0]||'';
  const D=[',','\t',';'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===D){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
    else c+=ch;
  }
  r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows;
}

async function forApi(b){
  let bm;try{bm=await createImageBitmap(b)}catch(e){throw{code:'image_rejected'}}
  const w=bm.width,h=bm.height,s=Math.min(1,1568/Math.max(w,h));let out=b;
  if(s<1||!API_TYPES.includes(b.type)||b.size>3.5e6){
    const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);out=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
  }
  bm.close();
  const data=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.onerror=j;fr.readAsDataURL(out)});
  return{type:out.type,data};
}
const TX_SCHEMA={type:'object',properties:{transactions:{type:'array',items:{type:'object',properties:{date:{type:'string'},description:{type:'string'},amount:{type:'number'},money:{type:'string',enum:['out','in']}},required:['date','description','amount','money']}}},required:['transactions']};
/* a small model reads one image at a time best, so each picture is its own call */
const deskSample={json:async(prompt,o={})=>{
  const imgs=o.images?[...o.images]:[],all=[];
  const one=async images=>{const r=await DESK.json({model:LOCAL_MODEL,prompt,images,schema:TX_SCHEMA});if(!r.ok)throw{code:r.code,message:r.message||''};all.push(...(r.data?.transactions||[]))};
  if(!imgs.length)await one([]);
  for(let i=0;i<imgs.length;i++){o.onPart?.(i+1,imgs.length);await one([(await forApi(imgs[i])).data])}
  return{transactions:all};
}};

/* Claude sees each image at about 1.2 megapixels, so tall phone screenshots go as overlapping pieces to keep small text readable */
async function shotPieces(files,lim){
  const out=[];let cut=false;
  for(const f of files){
    let bm;try{bm=await createImageBitmap(f)}catch(e){throw{code:'image_rejected'}}
    const w=bm.width,h=bm.height,n=h/w>1.6?Math.ceil(h/w/1.2):1;
    if(n===1&&lim.mediaTypes.includes(f.type)&&f.size<=lim.maxInputBytes){out.push(f);bm.close();continue}
    const step=Math.ceil(h/n),ov=n>1?Math.round(w*.08):0;
    for(let i=0;i<n;i++){
      const y0=Math.max(0,i*step-ov),y1=Math.min(h,(i+1)*step+ov),c=document.createElement('canvas');
      c.width=w;c.height=y1-y0;c.getContext('2d').drawImage(bm,0,y0,w,y1-y0,0,0,w,y1-y0);
      out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.9)));
    }
    if(n>1)cut=true;bm.close();
  }
  return{blobs:out,cut};
}
function claudeErr(e,what){
  const c=e&&e.code;
  if(c==='not_granted'||c==='sampling_disabled')return T('Claude isn’t allowed for this page. You can still import a CSV.');
  if(c==='offline')return T('Ollama isn’t running. Open the Ollama app, then try again.');
  if(c==='no_model')return T('Ollama doesn’t have {model}. In Terminal, run: ollama pull {model}',{model:LOCAL_MODEL});
  if(c==='timeout')return T('The local AI took too long. Try a shorter statement or fewer screenshots.');
  if(c==='pdf_scan')return T('That PDF has no text in it, so it’s probably a scan. Take screenshots of its pages and import those instead.');
  if(c==='pdf_locked')return T('That PDF is password-protected. Save an unlocked copy and try again.');
  if(c==='pdf_big')return T('That PDF is too big to read here (over {mb} MB or {pages} pages). Save just the pages with transactions and try again.',{mb:PDF_MAX_MB,pages:PDF_MAX_PAGES});
  if(c==='pdf_error')return T('Couldn’t open that PDF.');
  if(c==='too_long')return T('That’s too many transactions at once. Try fewer screenshots.');
  if(c==='refused')return T('{ai} wouldn’t read {what}. Try a different one, or use CSV.',{ai:aiName(),what});
  if(c==='image_rejected')return T('{ai} couldn’t open that image. Use a PNG or JPEG screenshot.',{ai:aiName()});
  if(c==='rate_limited')return T('Claude is busy or you’ve reached your usage limit. Try again later.');
  if(c==='invalid_json'||c==='empty_completion')return T('{ai} couldn’t find transactions in {what}.',{ai:aiName(),what});
  if(c==='cancelled')return'';
  if(c==='ai_error'&&e.message)return T('{ai} ran into a problem: {msg}',{ai:aiName(),msg:e.message});
  return T('{ai} could not read {what}. Try again, or use CSV.',{ai:aiName(),what});
}
/* statement text in pieces a small model can hold; long pages split on line breaks */
function chunkText(pages,max){
  const out=[];let cur='';
  const push=t=>{if(cur&&cur.length+2+t.length>max){out.push(cur);cur=''}cur+=(cur?'\n\n':'')+t};
  pages.forEach(pg=>{if(pg.length<=max)push(pg);else{let part='';pg.split('\n').forEach(l=>{if(part&&part.length+1+l.length>max){push(part);part=''}part+=(part?'\n':'')+l});if(part)push(part)}});
  if(cur)out.push(cur);return out;
}

function cal(list,tips){
  const dueMarks=build(view.y,view.m).filter(e=>e.pay&&e.due!==e.date&&(!KICK()||e.due>=KICK()));
  /* weeks start on Sunday in English and on Monday in Russian */
  const ws=LANG==='ru'?1:0,first=(new Date(view.y,view.m,1).getDay()-ws+7)%7,dim=new Date(view.y,view.m+1,0).getDate();
  let h=Array.from({length:7},(_,i)=>`<div class="dow">${cap(dfmt({weekday:'short'}).format(new Date(2000,0,2+ws+i)))}</div>`).join('')+'<div class="blank"></div>'.repeat(first);
  for(let d=1;d<=dim;d++){

function sim(extra,strat,roll){
  const cm=now.getFullYear()*12+now.getMonth()+1;
  const ds=plan.accounts.filter(a=>isDebt(a)&&+a.bal>0&&+a.min>0&&(a.type==='loan'||+a.apr>0)).map(a=>({id:a.id,name:a.name,bal:+a.bal,apr:+a.apr||0,min:+a.min,start:a.type==='loan'?Math.max(cm,loanStart(a)):cm}));
  if(!ds.length)return null;
  const base=Math.min(...ds.map(d=>d.start)),done={};let interest=0,n=0,freed=0;
  while(ds.some(d=>d.bal>0.005)&&n<600){
    const m=base+n;n++;let pool=extra+(roll?freed:0);
    ds.forEach(d=>{if(d.bal<=0.005||m<d.start)return;const i=d.bal*d.apr/1200;d.bal+=i;interest+=i;const p=Math.min(d.bal,d.min);d.bal-=p;pool+=roll?d.min-p:0});
    const act=ds.filter(d=>d.bal>0.005&&m>=d.start).sort(strat==='snowball'?(a,b)=>a.bal-b.bal:(a,b)=>b.apr-a.apr||a.bal-b.bal);
    for(const d of act){if(pool<=0)break;const p=Math.min(pool,d.bal);d.bal-=p;pool-=p}
    ds.forEach(d=>{if(d.bal<=0.005&&done[d.id]==null){done[d.id]=m;freed+=d.min}});
  }
  return{done,interest,last:Math.max(...Object.values(done))};
}

}

  const prev=ms.slice(2,5).filter(m=>spent(m).length),now_=byCat(cur),cats=new Set([...Object.keys(now_),...prev.flatMap(m=>Object.keys(byCat(m)))]);

    [...cats].forEach(c=>{const a=prev.reduce((x,m)=>x+(byCat(m)[c]||0),0)/prev.length,v=now_[c]||0;out.push(`${cn(c)}: ${f2(v)} this month, average ${f2(a)}, difference ${v-a>=0?'+':'−'}${f2(Math.abs(v-a))}`)})}

const ASK_RULES=`You help someone understand their own spending inside a budgeting app called Budgeter. Answer from the facts below only. The app has already done the math, so quote its numbers rather than calculating new totals, and if the facts don't answer the question, say what's missing. Keep it short: a sentence or two, then up to 5 bullet points when they help. Practical budgeting suggestions are fine; don't recommend investments or financial products.\n\nFACTS\n`;

document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip');if(!g||!plan||e.button>0)return;
  e.preventDefault();
  /* listen on the document: moving the row in the DOM drops pointer capture on the grip */
  const tr=g.closest('tr'),tb=tr.parentNode,pid=e.pointerId;let lastY=e.clientY,raf=0;
  tr.classList.add('drag');document.body.classList.add('dragging');
  /* the row goes past every neighbour whose middle the pointer has crossed */
  const place=y=>{
    const rows=[...tb.querySelectorAll('tr[data-cat]')],i=rows.indexOf(tr);let j=i;
    for(let k=0;k<rows.length;k++){
      if(k===i)continue;const b=rows[k].getBoundingClientRect(),mid=b.top+b.height/2;
      if(k<i&&y<mid){j=k;break}
      if(k>i&&y>mid)j=k;
    }
    if(j<i)tb.insertBefore(tr,rows[j]);else if(j>i)tb.insertBefore(tr,rows[j].nextSibling);
  };
  const edge=()=>{const d=lastY<70?-12:lastY>innerHeight-70?12:0;if(d){scrollBy(0,d);place(lastY);raf=requestAnimationFrame(edge)}else raf=0};
  const move=ev=>{if(ev.pointerId!==pid)return;ev.preventDefault();lastY=ev.clientY;place(lastY);if(!raf)raf=requestAnimationFrame(edge)};
  const end=ev=>{
    if(ev.pointerId!==pid)return;
    cancelAnimationFrame(raf);document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);
    tr.classList.remove('drag');document.body.classList.remove('dragging');
